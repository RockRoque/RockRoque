# tmux config used for the e-ink session that the reMarkable displays.
# Loaded by mac/attach.sh (which is what the tablet runs over SSH) and by
# the local `eink` command, so both ends share one tmux server.

# The tablet is the smaller client; let its size drive the layout so the
# Mac window never scrolls text off the e-ink screen.
set -g window-size smallest
setw -g aggressive-resize on

# Plain black-on-white chrome. E-ink is grayscale; colour just adds noise.
set -g status on
set -g status-position bottom
set -g status-style "bg=white,fg=black"
set -g status-left "[#S] "
set -g status-right "#(tmux list-clients | wc -l | tr -d ' ') clients  %H:%M"
set -g status-interval 15
setw -g window-status-current-style "bg=black,fg=white"
set -g pane-border-style "fg=black"
set -g pane-active-border-style "fg=black"
set -g message-style "bg=black,fg=white"

# No bells, no flashing: every visual event costs an e-ink refresh.
set -g visual-bell off
set -g visual-activity off
set -g bell-action none
setw -g monitor-activity off

# Snappier escape handling (helps vim/micro over SSH).
set -sg escape-time 10
set -g history-limit 20000
set -g default-terminal "screen-256color"
set -g mouse off
